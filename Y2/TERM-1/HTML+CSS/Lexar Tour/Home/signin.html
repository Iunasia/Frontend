<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap');
    </style>
</head>
<body>
    <div class="w-full bg-[url('./img/bg-signin.jpg')] bg-cover bg-center h-screen flex items-center justify-center">
        <div class="bg-transparent w-1/2 flex flex-col justify-center px-16 text-white">
            <h1 class="font-['Roboto_Slab'] font-bold text-4xl mb-10">SIGN IN</h1>

            <div class="mb-8">
                <label class="text-sm text-white">Username/Email</label>
                <input
                type="text"
                class="w-full bg-transparent border-b border-white focus:outline-none focus:border-blue-500 py-2"
                />
            </div>

            <div class="mb-10">
                <label class="text-sm text-white">Password</label>
                <input
                type="password"
                class="w-full bg-transparent border-b border-white focus:outline-none focus:border-blue-500 py-2"
                />
            </div>

            <div class="justify-between flex items-center mb-10 text-sm text-white font-bold font-['Roboto_Slab']">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button class="bg-indigo-500 hover:bg-indigo-600 transition py-3 rounded text-white font-medium">
                SIGN IN
            </button>
            <div>
                <p class="font-bold folt-['Roboto-Slab']">Don't have an account? <a href="./signup.html" class="text-indigo-400">Sign up</a></p>
            </div>

        </div>
    </div>    
</body>
</html>
