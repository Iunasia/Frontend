<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1.5 - The Light Switch</title>
</head>
<body>
    <div id="room" style="
        width: 200px;
        height: 200px;
        border: 1px solid black;
        background-color: white;
        margin-bottom: 20px;
        ">
    </div>
    <button id="dd">Light Switch</button>
    <p id="status-text">Lights are ON</p>

    <script>
        const box = document.getElementById("room");
        const toggle = document.getElementById("schwit-btn");
        const stat = document.getElementById("status-text");
        let isLightOn = true;

        function render(){
            if (isLightOn){
                box.style.backgroundColor =  "black";
                stat.textContent = "Lights are OFF";
            } else {
                box.style.backgroundColor =  "white"; 
                stat.textContent = "Lights are ON";
            }
            isLightOn = !isLightOn;
        }
        toggle.addEventListener("click" , render);
    </script>
</body>
</html>
