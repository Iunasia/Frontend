<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    header,
    footer,
    main,
    aside,
    .item {
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    header {
      background: #3b90ff;
      height: 60px;
    }

    footer {
      background: #3b90ff;
      height: 60px;
    }

    .content {
      display: flex;
      flex-grow: 1;
      gap: 1rem;
    }

    main {
      background: #63b37f;
      flex-grow: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem;
      align-content: flex-start;
    }

    .item {
      background: #82d3a9;
      flex: 1 1 calc(33% - 1rem);
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    aside {
      background: #f26d27;
      width: 200px;
      flex-shrink: 0;
    }

  </style>
</head>
<body>
  <header></header>

  <div class="content">
    <main>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
      <div class="item">Item</div>
    </main>

    <aside></aside>
  </div>

  <footer></footer>
</body>
</html>
